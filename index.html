<style>
:root{--bg:#e8eee2;--card:#f8f9f2;--ink:#0b261b;--mut:#51635a;--pri:#0f5a41;--on:#fff;--acc:#e8b43a;--neg:#b8400a;--line:#cdd9c6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);-webkit-text-size-adjust:100%;min-height:100vh}
header{padding:16px 14px 6px;max-width:520px;margin:0 auto}
header h1{margin:0 0 2px}
header p{margin:0 0 10px;font-size:13px;font-weight:600}
header .row{display:flex;align-items:center}
main{padding:4px 12px 120px;max-width:520px;margin:0 auto}
.card{padding:14px;margin:12px 0}
.card h2{font-size:17px;margin:0 0 10px}
button{border:0;font:inherit;font-weight:700;padding:11px 16px;cursor:pointer;font-size:14px}
button.sm{padding:6px 11px;font-size:12px}
button.full{width:100%}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;font-size:15px;margin:4px 0 10px;outline:none}
textarea{min-height:64px;resize:vertical}
label{font-size:12.5px;font-weight:700;color:var(--mut)}
nav{left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;padding:8px 6px calc(8px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:6px 2px;gap:2px;font-weight:700}
nav button .e{font-size:20px;line-height:1}
nav .plus{font-size:32px;font-weight:800;border-radius:50%;padding:0;justify-content:center;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px}
.kpi small{display:block;color:var(--mut);font-size:11.5px;font-weight:700;margin-bottom:2px}
.kpi b{font-size:18px}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}
.ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 38px}
.ith{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:0 0 44px;border:2px solid #e8b43a;cursor:zoom-in;background:#f3f0e6;display:block}.ith.big{width:84px;height:84px;flex:0 0 84px;border-radius:16px}.ith.sm{width:34px;height:34px;flex:0 0 34px;border-radius:9px;border-width:1.5px}
.ln.lp{grid-template-columns:34px 1fr 86px 38px}.lnp{width:34px;height:34px;border-radius:9px;background:#e8eee2;border:1px dashed #c9d6c0}
.picbox{display:flex;gap:12px;align-items:center;margin:2px 0 12px}.picbox img{width:96px;height:96px;object-fit:cover;border-radius:14px;border:2px solid #e8b43a}.picnone{width:96px;height:96px;border-radius:14px;border:2px dashed #c9d6c0;display:flex;align-items:center;justify-content:center;font-size:34px;background:#f5f7f2}
.picbig{max-width:100%;max-height:72vh;display:block;margin:0 auto 12px;border-radius:12px}
.mut{color:var(--mut);font-size:12.5px}
.neg{color:var(--neg)}.pos{color:var(--pri)}
.hide{display:none!important}
#sheet,#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#dlg{align-items:center;z-index:60}
#sheet .in{width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}
#sheet h2,#dlg h2{margin:2px 0 12px;font-size:19px}
#dlg .in{width:92%;max-width:420px;border-radius:22px;padding:18px;max-height:85vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);padding:10px 16px;z-index:70;font-weight:700;max-width:90%;text-align:center}
.bar{position:sticky;top:0;z-index:20;text-align:center;font-weight:800;font-size:12.5px;padding:7px 10px}
.bar.off{background:#b8400a;color:#fff}.bar.sync,.bar.demo{background:#e8b43a;color:#1c2b0f}
.turn{padding:18px;margin:12px 0;color:#fff}
.turn h2{margin:4px 0}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#e1ecdc;color:var(--pri);vertical-align:middle}
.tag.pend{background:#fff0c9;color:#8a5a00}.tag.rej{background:#fde3d8;color:var(--neg)}.tag.offt{background:#eee;color:#777}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--mut);font-size:11px}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{padding:7px 13px;font-size:12.5px;white-space:nowrap;flex:0 0 auto}
.ln{display:grid;grid-template-columns:1fr 86px 38px;gap:6px;align-items:center}
.ln select,.ln input{margin:3px 0}
.ln button{padding:8px 0}
.logo{width:96px;height:96px;border-radius:50%;margin:6px auto 12px;background:radial-gradient(circle at 30% 25%,#14805c,#052e20);border:3px solid #e8b43a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f6cf5b;font-weight:800;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.logo b{font-size:27px;letter-spacing:1px;line-height:1}.logo span{font-size:8.5px;letter-spacing:2px;color:#fff;margin-top:3px}
.logo-sm{font-weight:800;color:#f6cf5b;border:1.5px solid #e8b43a;border-radius:999px;padding:4px 10px;font-size:11px;letter-spacing:1px}
.center{text-align:center}
.big{font-size:30px;font-weight:800}
.foot{text-align:center;color:#cfe6d9;font-size:11px;margin:18px 0 0}
.chk{display:flex;align-items:center;gap:8px;margin:2px 0 12px;font-weight:700}
.chk input{width:22px;height:22px;margin:0}
.rep-tools{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:10px 12px;max-width:820px;margin:0 auto}
.rep{background:#fff;color:#111;max-width:820px;margin:0 auto 30px;padding:18px;font-size:12.5px;border-radius:12px;position:relative;z-index:1}
.rep h1{font-size:20px;margin:0}.rep h3{margin:16px 0 6px;font-size:14px}
.rep table td,.rep table th{border-bottom:1px solid #ddd}
.rep .tot td{font-weight:800;border-top:2px solid #333}
@media print{.noprint,nav,header,.bar{display:none!important}body,html{background:#fff!important}body::before{display:none!important}.rep{margin:0;max-width:none;border-radius:0;padding:0}}
[dir=rtl] .ln{direction:rtl}
</style>

V={
en:['English','Welcome to Alina Boutique','Enter your name to continue','Your name','Start','You cannot change anything in this app, it is only for your review.','Continue','Assalam o Alaikum, welcome!\n\nThank you for choosing Alina Boutique. It is an easy app to keep the record of stock, sales and distributors of a clothing business.\n\nIts aim is to keep every piece given, every sale, payment and balance clear and transparent, without any hassle.\n\nI hope you like this app. Your opinions and suggestions are always welcome.\n\nI do not only make this, I also build any app, tool or website. If you need one, feel free to contact me.\n\n— Yasir Wahab'],
ru:['Roman Urdu','Alina Boutique mein khush amdeed','Aage barhne ke liye apna naam likhein','Aap ka naam','Shuru karein','Aap is app mein kuch tabdili nahi kar sakte, ye sirf aap ke review ke liye hai.','Aage barhein','Assalam o Alaikum, khush amdeed!\n\nAlina Boutique chunne ka shukriya. Ye kapdon ke business ke liye maal, bikri aur distributors ke hisab ki aasan app hai.\n\nIs ka maqsad hai ke diya hua maal, bikri, payment aur bakaya sab saaf, shaffaf aur bina jhanjhat ke rahe.\n\nUmeed hai ye app aap ko pasand aaye. Aap ki raye aur mashware hamesha khush amdeed hain.\n\nMain sirf yehi nahi, koi bhi app, tool ya website bhi banata hoon. Zaroorat ho to mujh se rabta karein.\n\n— Yasir Wahab'],
ur:['اردو','الینا بوتیک میں خوش آمدید','آگے بڑھنے کے لیے اپنا نام لکھیں','آپ کا نام','شروع کریں','آپ اس ایپ میں کچھ تبدیلی نہیں کر سکتے، یہ صرف آپ کے ریویو کے لیے ہے۔','آگے بڑھیں','السلام علیکم، خوش آمدید!\n\nAlina Boutique چننے کا شکریہ۔ یہ کپڑوں کے کاروبار کے لیے مال، فروخت اور ڈسٹری بیوٹرز کے حساب کی آسان ایپ ہے۔\n\nاس کا مقصد ہے کہ دیا ہوا مال، فروخت، ادائیگی اور بقایا سب صاف، شفاف اور بغیر جھنجھٹ کے رہے۔\n\nامید ہے یہ ایپ آپ کو پسند آئے۔ آپ کی رائے اور مشورے ہمیشہ خوش آمدید ہیں۔\n\nمیں صرف یہی نہیں، کوئی بھی ایپ، ٹول یا ویب سائٹ بھی بناتا ہوں۔ ضرورت ہو تو مجھ سے رابطہ کریں۔\n\n— یاسر وہاب'],
ar:['العربية','مرحباً بكم في Alina Boutique','اكتب اسمك للمتابعة','اسمك','ابدأ','لا يمكنك تغيير أي شيء في هذا التطبيق، فهو للمراجعة فقط.','التالي','السلام عليكم، أهلاً وسهلاً!\n\nشكراً لاختيارك Alina Boutique. إنه تطبيق سهل لتسجيل البضاعة والمبيعات وحسابات الموزعين لأعمال الملابس.\n\nهدفه أن تبقى البضاعة المسلَّمة والمبيعات والمدفوعات والرصيد واضحة وشفافة دون أي تعقيد.\n\nأتمنى أن ينال التطبيق إعجابك. آراؤك واقتراحاتك مرحَّب بها دائماً.\n\nلا أصنع هذا فقط، بل أبني أي تطبيق أو أداة أو موقع. تواصل معي عند الحاجة.\n\n— ياسر وهاب'],
hi:['हिन्दी','Alina Boutique में स्वागत है','आगे बढ़ने के लिए अपना नाम लिखें','आपका नाम','शुरू करें','आप इस ऐप में कोई बदलाव नहीं कर सकते, यह सिर्फ़ आपके रिव्यू के लिए है।','आगे बढ़ें','अस्सलाम अलैकुम, स्वागत है!\n\nAlina Boutique चुनने का शुक्रिया। यह कपड़ों के कारोबार के लिए माल, बिक्री और डिस्ट्रीब्यूटरों के हिसाब का आसान ऐप है।\n\nइसका मक़सद है कि दिया गया माल, बिक्री, पेमेंट और बकाया सब साफ़ और पारदर्शी रहे, बिना किसी झंझट के।\n\nउम्मीद है यह ऐप आपको पसंद आए। आपकी राय और सुझाव हमेशा स्वागत हैं।\n\nमैं सिर्फ़ यही नहीं, कोई भी ऐप, टूल या वेबसाइट भी बनाता हूँ। ज़रूरत हो तो मुझसे संपर्क करें।\n\n— यासिर वहाब'],
bn:['বাংলা','Alina Boutique-এ স্বাগতম','এগিয়ে যেতে আপনার নাম লিখুন','আপনার নাম','শুরু করুন','আপনি এই অ্যাপে কিছু পরিবর্তন করতে পারবেন না, এটি শুধু আপনার রিভিউর জন্য।','এগিয়ে যান','আসসালামু আলাইকুম, স্বাগতম!\n\nAlina Boutique বেছে নেওয়ার জন্য ধন্যবাদ। এটি কাপড়ের ব্যবসার মাল, বিক্রি ও ডিস্ট্রিবিউটরদের হিসাব রাখার সহজ অ্যাপ।\n\nএর লক্ষ্য হলো দেওয়া মাল, বিক্রি, পেমেন্ট ও বকেয়া সব পরিষ্কার ও স্বচ্ছ রাখা, কোনো ঝামেলা ছাড়াই।\n\nআশা করি অ্যাপটি আপনার ভালো লাগবে। আপনার মতামত ও পরামর্শ সবসময় স্বাগত।\n\nআমি শুধু এটাই নয়, যেকোনো অ্যাপ, টুল বা ওয়েবসাইটও বানাই। প্রয়োজনে যোগাযোগ করুন।\n\n— ইয়াসির ওয়াহাব'],
id:['Indonesia','Selamat datang di Alina Boutique','Tulis nama Anda untuk melanjutkan','Nama Anda','Mulai','Anda tidak dapat mengubah apa pun di aplikasi ini, ini hanya untuk ulasan Anda.','Lanjutkan','Assalamualaikum, selamat datang!\n\nTerima kasih telah memilih Alina Boutique. Ini aplikasi mudah untuk mencatat stok, penjualan, dan distributor bisnis pakaian.\n\nTujuannya agar barang yang diberikan, penjualan, pembayaran, dan saldo tetap jelas dan transparan tanpa repot.\n\nSemoga Anda menyukai aplikasi ini. Pendapat dan saran Anda selalu diterima.\n\nSaya tidak hanya membuat ini, saya juga membuat aplikasi, alat, atau situs web apa pun. Hubungi saya bila perlu.\n\n— Yasir Wahab']

function aggV(d,k){if(!d)return 0;return k==='g'?d.g+d.o:(d[k]||0)}

function entryV(x,k,item){const ls=(x.lines||[]).filter(l=>!item||l.i===item);const q=ls.reduce((s,l)=>s+(+l.q||0),0);const c=i=>+(S.cost[i]?.c)||0;
 switch(k){case 'g':case 's':case 'r':case 'l':return q;case 'left':return (x.type==='give'||x.type==='open'?1:-1)*q;
 case 'sv':return ls.reduce((s,l)=>s+l.q*l.d,0);case 'dp':return ls.reduce((s,l)=>s+l.q*(l.s-l.d),0);case 'ap':return ls.reduce((s,l)=>s+l.q*(l.d-c(l.i)),0);case 'lv':return ls.reduce((s,l)=>s+l.q*c(l.i),0);
 case 'paid':case 'pend':return +x.amt||0;case 'due':return x.type==='pay'?-(+x.amt||0):x.type==='open'?(+x.amt||0):ls.reduce((s,l)=>s+l.q*l.d,0)}return 0}
function entOk(x,k){if(!MT[k].includes(x.type))return false;if(k==='paid'||k==='due')return x.type!=='pay'||x.st==='ok';if(k==='pend')return x.st==='pending';return true}
function byTxt(x){return x.by===x.dist?t('byDist'):t('byMalik')}
function entTable(list,k,item,withDist){let tot=0;const rows=list.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.at||0)-(b.at||0)).map(x=>{const v=entryV(x,k,item);tot+=v;return `<tr><td>${fdate(x.date)}</td><td>${ICON[x.type]||''} <b>${t('t'+x.type)}</b>${withDist?`<div class="mut">${esc(distName(x.dist))}</div>`:''}<div class="mut">${(x.lines||[]).filter(l=>!item||l.i===item).map(l=>esc(itemName(l.i))+' × '+fmt(l.q)).join(', ')}</div><div class="mut" style="font-size:11px">✍️ ${byTxt(x)}${x.note?' · 📝 '+esc(x.note):''}</div></td><td class="n"><b>${MONEYK[k]?money(v):fmt(v)}</b></td></tr>`}).join('');
 return list.length?`<table><tr><th>${t('date')}</th><th>${t('entries')}</th><th class="n">${t('total')}</th></tr>${rows}<tr class="tot"><td colspan="2"><b>${t('total')}</b></td><td class="n"><b>${fmtK(k,tot)}</b></td></tr></table>`:empty()}
function showEntries(id,k,label){const list=txArr().filter(x=>x.dist===id&&entOk(x,k));sheet(`<h2>📅 ${label}</h2><p class="mut" style="margin-top:-6px">${t('howMade')} · ${esc(distName(id))}</p>${entTable(list,k,null,false)}<button class="full ghost" style="margin-top:12px" onclick="closeSheet()">${t('back')}</button>`)}
function showMetric(k,label){let list=txArr();if(S.month!=='all')list=list.filter(x=>x.m===S.month);const A=agg(list);let tot=0;
 const rows=distUsers().map(d=>{const v=aggV(A[d.id],k);tot+=v;return `<div class="li click" onclick="closeSheet();openDist('${d.id}')"><div class="ico">👤</div><div class="sp"><b>${esc(d.name)}</b></div><b class="num">${fmtK(k,v)}</b> <span style="color:#b8860b">▸</span></div>`}).join('');
 sheet(`<h2>📊 ${label}</h2><p class="mut" style="margin-top:-6px">${t('perDist')} · ${S.month==='all'?t('since'):mName(S.month)}</p>${rows||empty()}<div class="li" style="border-top:2px solid var(--line)"><div class="sp"><b>${t('total')}</b></div><b class="num">${fmtK(k,tot)}</b></div><button class="full ghost" style="margin-top:12px" onclick="closeSheet()">${t('back')}</button>`)}
function dueTxt(v){return r2(v)<0?money(v)+' ('+t('adv')+')':money(v)}
function dueCls(v){return r2(v)>0?'neg':r2(v)<0?'pos':''}
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);

function picUrl(i){const pv=S.items[i]?.pv;if(!pv)return null;const c=S.pc[i];if(c&&c.v===pv)return c.u||null;
 if(!c||c.v!==pv){S.pc[i]={v:pv,u:null};
  if(S.mode==='real'&&db)db.collection('pics').doc(i).get().then(d=>{if(S.pc[i]&&S.pc[i].v===pv){S.pc[i].u=d.exists?d.data().p:null;picReady(i)}}).catch(e=>console.warn('pic',e));
  else{S.pc[i].u=S.pics[i]?.p||null}}
 return S.pc[i].u||null}
function thumb(i,cls,fb){const u=picUrl(i);if(u)return `<img class="ith ${cls||''}" src="${u}" alt="" onclick="event.stopPropagation();showPic('${i}')">`;const f=fb===undefined?`<div class="ico">👗</div>`:fb;return S.items[i]?.pv?`<span data-pi="${i}" data-pc="${cls||''}" style="display:contents">${f}</span>`:f}
function picReady(i){if(!S.pc[i]?.u)return;document.querySelectorAll(`[data-pi="${i}"]`).forEach(e=>e.outerHTML=thumb(i,e.dataset.pc));if(S.iid===i&&S.ipic==null)drawPicBox();later()}
function showPic(i){const u=picUrl(i);if(!u)return;dlg(`<img class="picbig" src="${u}" alt=""><p class="center" style="font-weight:800;margin:0 0 10px">${esc(itemName(i))}</p><button class="full" onclick="closeDlg()">${t('close')}</button>`)}
function shrinkPic(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
 const go=(max,q)=>{const k=Math.min(1,max/Math.max(im.width,im.height));const w=Math.round(im.width*k),h=Math.round(im.height*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);return c.toDataURL('image/jpeg',q)};
 let u=go(800,0.78);if(u.length>260000)u=go(800,0.65);if(u.length>260000)u=go(640,0.6);if(u.length>700000)return no(new Error('big'));ok(u)};im.src=r.result};r.readAsDataURL(file)})}
async function pickPic(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;toast(t('picBusy'));
 try{S.ipic=await shrinkPic(f);drawPicBox()}catch(e){console.warn(e);toast(t('picErr'))}}
function picBoxH(){const cur=S.ipic==='del'?null:(S.ipic||(S.iid?picUrl(S.iid):null));
 return `${cur?`<img src="${cur}" alt="">`:`<div class="picnone">📷</div>`}<div class="sp"><label class="btn" style="display:inline-block;margin:0 0 6px;cursor:pointer"><span class="sm" style="display:inline-block;padding:9px 12px;border-radius:12px;background:#0f7a4f;color:#fff;font-weight:800">${cur?t('chgPhoto'):t('addPhoto')}</span><input type="file" accept="image/*" style="display:none" onchange="pickPic(this)"></label>${cur?`<br><button class="sm danger" onclick="S.ipic='del';drawPicBox()">${t('delPhoto')}</button>`:''}<div class="mut" style="font-size:11px;margin-top:4px">${t('picNote')}</div></div>`}

function memSet(c,id,d,merge){if(c==='cfg'&&id==='code'){S.code=d.c;return}if(c==='cfg'){const k=id==='app'?'cfg':'vcfg';S[k]=merge?{...S[k],...d}:{...d}}else{S[c][id]=merge?{...(S[c][id]||{}),...d}:{...d}}}
const DB={
 real(){return S.mode==='real'&&db},
 set(c,id,d,merge){if(this.real())return db.collection(c).doc(id).set(d,merge?{merge:true}:{}).catch(werr);memSet(c,id,d,merge);later();return Promise.resolve()},
 upd(c,id,d){if(this.real())return db.collection(c).doc(id).update(d).catch(werr);memSet(c,id,d,true);later();return Promise.resolve()},
 del(c,id){if(this.real())return db.collection(c).doc(id).delete().catch(werr);delete S[c][id];later();return Promise.resolve()},
 batch(ops){
  if(this.real()){const ps=[];for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(o=>{const r=db.collection(o.c).doc(o.id);o.o==='del'?b.delete(r):o.o==='upd'?b.update(r,o.d):b.set(r,o.d,o.merge?{merge:true}:{})});ps.push(b.commit().catch(werr))}return Promise.all(ps)}
  ops.forEach(o=>o.o==='del'?delete S[o.c][o.id]:memSet(o.c,o.id,o.d,o.o==='upd'||o.merge));later();return Promise.resolve()}
};
function stop(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
function listen(){
 stop();
 const L=(q,fn,meta)=>unsubs.push(q.onSnapshot(meta?{includeMetadataChanges:true}:{},fn,e=>console.warn('listen',e)));
 const col=(c,q)=>L(q||db.collection(c),s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S[c]=m;if(c==='tx')S.pend=s.docs.filter(d=>d.metadata.hasPendingWrites).length;later()},c==='tx');
 L(db.collection('cfg').doc('app'),s=>{if(s.exists)S.cfg={...S.cfg,...s.data()};later()});
 col('cats');col('items');
 if(S.role==='admin'){col('cost');col('users');col('tx');L(db.collection('cfg').doc('code'),s=>{S.code=s.exists?(s.data().c||''):'';later()})}
 else{col('tx',db.collection('tx').where('dist','==',S.uid));
  L(db.collection('users').doc(S.uid),s=>{if(s.exists){S.me=s.data();if(S.me.active===false){stop();return gate('accOff',true)}}later()})}
 if(S.owner){L(db.collection('cfg').doc('visitor'),s=>{S.vcfg=s.exists?{wa:'',msgs:{},...s.data()}:{wa:'',msgs:{}};later()});col('vlinks')}
}

async function boot(){

async function onAuth(u){
 if(S.busy)return;
 if(S.vtok){
  if(u&&!u.isAnonymous)return gate('loggedIn',true);
  if(!u)return auth.signInAnonymously().catch(e=>gate(/operation-not-allowed|admin-restricted/.test(e.code||'')?'anonOff':'connErr'));
  return visitorOpen(u);
 }

  try{const s=await db.collection('cfg').doc('app').get();S.hasMalik=!!(s.exists&&s.data().malik===true);if(s.exists)S.cfg={...S.cfg,...s.data()}}catch(e){S.hasMalik=true}

 S.uid=u.uid;S.screen='loading';render();
 let s;try{s=await db.collection('users').doc(u.uid).get()}catch(e){return gate('connErr',true)}
 let me=s.exists?s.data():null;
 if(!me){/* chhupa Owner: rules sirf owner email ko ijazat dete hain */
  const o={role:'admin',owner:true,name:'Owner',email:u.email||'',active:true,at:Date.now()};
  try{await db.collection('users').doc(u.uid).set(o);me=o}catch(e){return gate('noAcc',true)}}
 if(me.active===false)return gate('accOff',true);
 S.me=me;S.role=me.role==='dist'?'dist':'admin';S.owner=!!me.owner;S.tab='home';S.screen='app';
 if(S.as&&S.owner){S.asMode=true;if(S.as==='owner')S.asOwner=true;else S.owner=false;
  if(S.as.startsWith('dist:')){const did=S.as.slice(5);let d;try{d=await db.collection('users').doc(did).get()}catch(e){return gate('connErr')}
   if(!d.exists)return gate('noData');S.role='dist';S.uid=did;S.me=d.data()}}
 listen();render();
}

const leftOf=it=>it.g+it.o-it.s-it.r-it.l;
function agg(list){
 const A={};const D=id=>A[id]||(A[id]={g:0,o:0,s:0,r:0,l:0,sv:0,dp:0,ap:0,lv:0,paid:0,pend:0,pendN:0,oa:0,items:{}});
 for(const x of list){const d=D(x.dist);
  if(x.type==='pay'){if(x.st==='ok')d.paid+=+x.amt||0;else if(x.st==='pending'){d.pend+=+x.amt||0;d.pendN++}continue}
  if(x.type==='open')d.oa+=+x.amt||0;
  for(const ln of x.lines||[]){const q=+ln.q||0;const it=d.items[ln.i]||(d.items[ln.i]={g:0,o:0,s:0,r:0,l:0});const c=+(S.cost[ln.i]?.c)||0;
   if(x.type==='give'){d.g+=q;it.g+=q}else if(x.type==='open'){d.o+=q;it.o+=q}
   else if(x.type==='sale'){d.s+=q;it.s+=q;d.sv+=q*(+ln.d||0);d.dp+=q*((+ln.s||0)-(+ln.d||0));d.ap+=q*((+ln.d||0)-c)}
   else if(x.type==='ret'){d.r+=q;it.r+=q}else if(x.type==='loss'){d.l+=q;it.l+=q;d.lv+=q*c}}}
 for(const d of Object.values(A)){d.left=d.g+d.o-d.s-d.r-d.l;d.due=d.sv+d.oa-d.paid}
 return A;
}
function sumAgg(A){const T={g:0,o:0,s:0,r:0,l:0,sv:0,dp:0,ap:0,lv:0,paid:0,pend:0,pendN:0,oa:0,left:0,due:0};for(const d of Object.values(A))for(const k in T)T[k]+=d[k]||0;return T}

function delMonth(m){
 if(m>=curM())return toast(t('curMonthNo'));
 const list=txArr().filter(x=>x.m===m);if(!list.length)return toast(t('noData'));
 const all=agg(txArr()),ids=[...new Set(list.map(x=>x.dist))];
 const warn=ids.filter(d=>all[d]&&(r2(all[d].left)!==0||r2(all[d].due)!==0)).map(d=>`<li><b>${esc(distName(d))}</b>: ${money(all[d].due)} ${t('due')}, ${fmt(all[d].left)} ${t('pcs')}</li>`).join('');
 const pend=list.filter(x=>x.type==='pay'&&x.st==='pending').length;
 dlg(`<h2>🗑 ${mName(m)}</h2><p style="font-weight:700">${t('delMonthQ',mName(m),list.length)}</p><button class="full" style="margin-bottom:10px" onclick="closeDlg();repMonth('${m}')">📄 PDF</button>
 ${pend?`<p class="neg" style="font-weight:700">${t('pendWarn',pend)}</p>`:''}
 ${warn?`<p class="neg" style="font-weight:700;margin-bottom:4px">${t('warnLeft')}</p><ul style="margin-top:0;padding-inline-start:18px">${warn}</ul><button class="full ok" style="margin-bottom:8px" onclick="closeDlg();doDelMonth('${m}',true)">${t('carry')}</button>`:''}
 <div class="row"><button class="ghost sp" onclick="closeDlg()">${t('cancel')}</button><button class="danger sp" onclick="closeDlg();doDelMonth('${m}',false)">${warn?t('delAny'):t('del')}</button></div>`);
}
function doDelMonth(m,carry){
 const list=txArr().filter(x=>x.m===m),ops=list.map(x=>({o:'del',c:'tx',id:x.id}));
 if(carry){const A=agg(list),nm=nextM(m);
  for(const [dist,d] of Object.entries(A)){const lines=Object.entries(d.items).map(([i,it])=>({i,q:r2(leftOf(it)),d:0,s:0})).filter(l=>l.q!==0);const amt=r2(d.due);
   if(!lines.length&&!amt)continue;ops.push({o:'set',c:'tx',id:nid(),d:{type:'open',dist,date:nm+'-01',m:nm,lines,amt,by:S.uid,at:Date.now(),note:mName(m)}})}}
 DB.batch(ops);toast(t('deleted'));
}
const repHead=(title,sub)=>`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:3px solid #0b4a2f;padding-bottom:8px"><div><h1>${esc(S.cfg.bizName)}</h1><div style="font-weight:700;color:#0f5a41">${title}</div><div style="color:#555">${sub}</div></div><div style="text-align:end;color:#555;font-size:11px"><img class="rlogo" src="logo.png" alt=""><br>${t('made')}: ${fdate(today())}</div></div>`;
const repFoot=()=>`<p style="text-align:center;color:#777;font-size:10.5px;margin-top:18px">${t('devBy')}</p>`;
function repTx(list,withDist){return `<table><tr><th>${t('date')}</th>${withDist?`<th>${t('dist')}</th>`:''}<th>${t('entries')}</th><th class="n">${t('total')}</th></tr>${list.slice().reverse().map(x=>`<tr><td>${fdate(x.date)}</td>${withDist?`<td>${esc(distName(x.dist))}</td>`:''}<td><b>${t('t'+x.type)}</b>${x.type==='pay'?' ('+(x.st==='ok'?'✓':x.st==='pending'?t('pending'):t('reject'))+')':''}<br>${linesTxt(x)}${x.note?' · '+esc(x.note):''}</td><td class="n ${x.type==='pay'&&x.st==='ok'||x.type==='ret'?'gr':''}">${txVal(x)}</td></tr>`).join('')}</table>`}
function showRep(h){S.report=h+repFoot();S.screen='report';render();scrollTo(0,0)}
function repMonth(m){
 const list=txArr().filter(x=>x.m===m),A=agg(list),all=agg(txArr()),T=sumAgg(A);
 const ids=[...new Set([...Object.keys(A)])].sort((a,b)=>distName(a).localeCompare(distName(b)));
 showRep(repHead(t('monthRep'),mName(m))+`<h3>${t('dists')}</h3><table><tr><th>${t('dist')}</th><th class="n">${t('given')}</th><th class="n">${t('sold')}</th><th class="n">${t('returned')}</th><th class="n">${t('lost')}</th><th class="n">${t('saleVal')}</th><th class="n">${t('received')}</th><th class="n">${t('due')}*</th></tr>
 ${ids.map(d=>{const a=A[d];return `<tr><td>${esc(distName(d))}</td><td class="n">${fmt(a.g+a.o)}</td><td class="n">${fmt(a.s)}</td><td class="n gr">${fmt(a.r)}</td><td class="n">${fmt(a.l)}</td><td class="n">${fmt(a.sv)}</td><td class="n gr">${fmt(a.paid)}</td><td class="n rd">${fmt(all[d]?.due||0)}</td></tr>`}).join('')}
 <tr class="tot"><td>${t('total')}</td><td class="n">${fmt(T.g+T.o)}</td><td class="n">${fmt(T.s)}</td><td class="n">${fmt(T.r)}</td><td class="n">${fmt(T.l)}</td><td class="n">${fmt(T.sv)}</td><td class="n gr">${fmt(T.paid)}</td><td class="n rd">${fmt(ids.reduce((s,d)=>s+(all[d]?.due||0),0))}</td></tr></table>
 <p style="font-size:10.5px;color:#666">* ${t('dueAll')} (${S.cfg.cur||'Rs'})</p>
 ${S.role==='admin'?`<h3>${t('adminProfit')}: ${money(T.ap)} · ${t('distProfit')}: ${money(T.dp)} · ${t('lossVal')}: ${money(T.lv)}</h3>`:''}
 <h3>${t('entries')} (${list.length})</h3>${repTx(list,true)}`);
}
function repDist(id){S.itDist=id;
 const list=txArr().filter(x=>x.dist===id),A=agg(list)[id]||sumAgg({}),adm=S.role==='admin';
 showRep(repHead(t('statement'),esc(distName(id))+(S.users[id]?.phone?' · '+esc(S.users[id].phone):''))+`<h3>${t('since')}</h3><table>
 <tr><td>${t('given')}</td><td class="n">${fmt(A.g+A.o)} ${t('pcs')}</td><td>${t('saleVal')}</td><td class="n">${money(A.sv)}</td></tr>
 <tr><td>${t('sold')}</td><td class="n">${fmt(A.s)} ${t('pcs')}</td><td>${t('received')}</td><td class="n gr">${money(A.paid)}</td></tr>
 <tr><td>${t('returned')} / ${t('lost')}</td><td class="n">${fmt(A.r)} / ${fmt(A.l)}</td><td>${t('pending')}</td><td class="n">${money(A.pend)}</td></tr>
 <tr class="tot"><td>${t('left')}</td><td class="n">${fmt(A.left)} ${t('pcs')}</td><td>${t('due')}</td><td class="n rd">${dueTxt(A.due)}</td></tr></table>
 <p><b>${t('distProfit')}: ${money(A.dp)}</b>${adm?` · <b>${t('adminProfit')}: ${money(A.ap)}</b>`:''}</p>
 <h3>${t('perItem')}</h3>${itemTable(A,true)}<h3>${t('entries')} (${list.length})</h3>${repTx(list,false)}`);
}

/* ---------- owner ---------- */
function backup(){
 const data={app:'Alina Boutique',at:new Date().toISOString(),cfg:S.cfg,cats:S.cats,items:S.items,cost:S.cost,users:S.users,tx:S.tx};
 const b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Alina-Boutique-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast(t('backupDone'));
}
const linkUrl=k=>location.origin+location.pathname+'?v='+k;
function newLink(){if(needNet())return toast(t('needNet'));const k=ezCode(12);const n=Math.max(0,...Object.values(S.vlinks).map(l=>l.n||0))+1;DB.set('vlinks',k,{n,at:Date.now()});toast('Link '+n+' ✅')}
function copyTxt(txt){const done=()=>toast(t('copied'));const fb=()=>{try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();ok?done():dlg(`<p style="white-space:pre-wrap;word-break:break-all;font-weight:700">${esc(txt)}</p><button class="full" onclick="closeDlg()">OK</button>`)}catch(e){dlg(`<p style="white-space:pre-wrap;word-break:break-all;font-weight:700">${esc(txt)}</p><button class="full" onclick="closeDlg()">OK</button>`)}};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(fb);else fb()}
function shareLink(k){copyTxt(linkUrl(k))}
function delLink(k){confirmBox(t('del')+' Link '+(S.vlinks[k]?.n||'')+'?',()=>{DB.del('vlinks',k);toast(t('deleted'))})}
function saveVmsg(){const ml=S.vmLang||'ru',v=(S.vmDraft!=null?S.vmDraft:val('#vmText')).trim();const msgs={...(S.vcfg.msgs||{})};if(v&&v!==V[ml][7].trim())msgs[ml]=v;else delete msgs[ml];S.vmDraft=null;DB.set('cfg','visitor',{wa:S.vcfg.wa||'',msgs});toast(t('saved'))}
function resetVmsg(){const ml=S.vmLang||'ru';const msgs={...(S.vcfg.msgs||{})};delete msgs[ml];S.vmDraft=null;DB.set('cfg','visitor',{wa:S.vcfg.wa||'',msgs});toast(t('saved'))}
function saveWa(){const w=(S.waDraft!=null?S.waDraft:val('#vWa')).trim();S.waDraft=null;DB.set('cfg','visitor',{wa:w,msgs:S.vcfg.msgs||{}});toast(t('saved'))}

boot();
</script>
