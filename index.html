async function doLink(old,nw){const om=M.find(m=>m.id==old);if(!om)return;
 if(await run(async()=>{const q=await db.collection('rooms/'+cur+'/entries').get();
  for(const d of q.docs){const e=d.data(),n={};if(e.payer==old)n.payer=nw;if(e.by==old)n.by=nw;if(Array.isArray(e.split)&&e.split.includes(old))n.split=e.split.map(i=>i==old?nw:i);if(Object.keys(n).length)await d.ref.update(n)}
  const ru={};if(R.cook==old)ru.cook=nw;if(R.out&&R.out[old]){const o=JSON.parse(JSON.stringify(R.out));o[nw]=Array.from(new Set((o[nw]||[]).concat(o[old])));delete o[old];ru.out=o}
  if(Object.keys(ru).length)await db.doc('rooms/'+cur).update(ru);
  await memRef(nw).update({name:om.name,ord:(om.ord!=null?om.ord:om.joined)});await memRef(old).delete()}))alert('Jod diya.')}

const DM={
 en:'Hello and Welcome!\n\nThank you for choosing Hisab Kitab, a simple and smart app to track and share expenses with your roommates.\n\nMy goal is to make managing your shared costs easy, transparent and hassle-free.\n\nI hope you find this app useful. Your feedback and suggestions are always welcome, as they help me make it even better.\n\nI also build apps, tools and websites. If you need any app, tool or website, feel free to contact me.\n\n— Yasir Wahab',
 rur:'Assalam o Alaikum, khush amdeed!\n\nHisab Kitab chunne ka shukriya. Ye roommates ke saath kharcha likhne aur baantne ki aasan aur samajhdar app hai.\n\nMera maqsad hai ke aap ke mil kar kiye gaye kharche saaf, shaffaf aur bina jhanjhat ke sambhale ja sakein.\n\nUmeed hai ye app aap ko pasand aaye. Aap ki raye aur mashware hamesha khush amdeed hain, wo mujhe isay aur behtar banane mein madad dete hain.\n\nMain sirf yehi nahi, koi bhi app, tool ya website bhi banata hoon. Zaroorat ho to mujh se rabta karein.\n\n— Yasir Wahab',
 ur:'السلام علیکم، خوش آمدید!\n\nحساب کتاب کو منتخب کرنے کا شکریہ۔ یہ روم میٹس کے ساتھ اخراجات لکھنے اور بانٹنے کی آسان اور سمجھدار ایپ ہے۔\n\nمیرا مقصد ہے کہ آپ کے مشترکہ اخراجات کا انتظام آسان، شفاف اور بغیر جھنجھٹ کے ہو۔\n\nامید ہے یہ ایپ آپ کو پسند آئے گی۔ آپ کی رائے اور مشورے ہمیشہ خوش آمدید ہیں، یہ مجھے اسے مزید بہتر بنانے میں مدد دیتے ہیں۔\n\nمیں صرف یہی نہیں، کوئی بھی ایپ، ٹول یا ویب سائٹ بھی بناتا ہوں۔ ضرورت ہو تو مجھ سے رابطہ کریں۔\n\n— یاسر وہاب',
 ar:'مرحباً بك!\n\nشكراً لاختيارك «حساب كتاب»، تطبيق بسيط وذكي لتسجيل المصاريف ومشاركتها مع زملاء السكن.\n\nهدفي أن تكون إدارة مصاريفكم المشتركة سهلة وشفافة وبلا عناء.\n\nآمل أن يعجبك هذا التطبيق. ملاحظاتك واقتراحاتك مرحّب بها دائماً لأنها تساعدني على تحسينه.\n\nأقوم أيضاً ببناء تطبيقات وأدوات ومواقع إلكترونية. إذا احتجت إلى أي تطبيق أو أداة أو موقع، يسعدني تواصلك معي.\n\n— ياسر وهاب',
 hi:'नमस्ते, स्वागत है!\n\nहिसाब किताब चुनने के लिए धन्यवाद। यह रूममेट्स के साथ खर्च लिखने और बाँटने का आसान और स्मार्ट ऐप है।\n\nमेरा लक्ष्य है कि आपके साझा खर्चों का प्रबंधन आसान, पारदर्शी और बिना झंझट के हो।\n\nउम्मीद है यह ऐप आपको पसंद आएगा। आपकी राय और सुझाव हमेशा स्वागत योग्य हैं, ये मुझे इसे और बेहतर बनाने में मदद करते हैं।\n\nमैं सिर्फ़ यही नहीं, कोई भी ऐप, टूल या वेबसाइट भी बनाता हूँ। ज़रूरत हो तो मुझसे संपर्क करें।\n\n— यासिर वहाब',
 bn:'হ্যালো, স্বাগতম!\n\nহিসাব কিতাব বেছে নেওয়ার জন্য ধন্যবাদ। এটি রুমমেটদের সঙ্গে খরচ লেখা ও ভাগ করার সহজ ও স্মার্ট অ্যাপ।\n\nআমার লক্ষ্য আপনাদের যৌথ খরচের হিসাব সহজ, স্বচ্ছ ও ঝামেলাহীন রাখা।\n\nআশা করি অ্যাপটি আপনার ভালো লাগবে। আপনার মতামত ও পরামর্শ সবসময় স্বাগত, এগুলো আমাকে অ্যাপটি আরও ভালো করতে সাহায্য করে।\n\nআমি শুধু এটিই নয়, যেকোনো অ্যাপ, টুল বা ওয়েবসাইটও তৈরি করি। প্রয়োজন হলে আমার সঙ্গে যোগাযোগ করুন।\n\n— ইয়াসির ওয়াহাব',
 id:'Halo dan selamat datang!\n\nTerima kasih telah memilih Hisab Kitab, aplikasi sederhana dan cerdas untuk mencatat dan membagi pengeluaran bersama teman sekamar.\n\nTujuan saya adalah membuat pengelolaan biaya bersama menjadi mudah, transparan, dan bebas repot.\n\nSaya harap aplikasi ini bermanfaat. Masukan dan saran Anda selalu diterima karena membantu saya membuatnya lebih baik.\n\nSaya juga membuat aplikasi, alat, dan situs web apa pun. Jika Anda membutuhkannya, silakan hubungi saya.\n\n— Yasir Wahab'};

function vmParts(t){const p=String(t||'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);let sig='';if(p.length>1&&/^[—–-]/.test(p[p.length-1])&&p[p.length-1].length<60)sig=p.pop();const h=p.length>1?p.shift():'';return{h,p,sig}}
function vmCard(){const l=vmL||lang,dr=(l=='ur'||l=='ar')?'rtl':'ltr',txt=vmDr[l]!==undefined?vmDr[l]:((R.vmsg&&R.vmsg[l])||DM[l]||DM.en);
 return `<div class="card"><h2 style="font-size:20px">Visitor ka message</h2><div class="mut" style="margin:6px 0 10px">Visitor ko pehle page ke baad ye message nazar aata hai. Har zuban ka alag likhein. Pehla paragraph bara (heading) hota hai, aakhri "— naam" wali line dastkhat ban jati hai. Khali line se naya paragraph.</div><select id="vml">${Object.keys(VLN).map(k=>`<option value="${k}" ${k==l?'selected':''}>${VLN[k]}</option>`).join('')}</select><textarea id="vmt" rows="13" dir="${dr}" style="margin-top:10px;width:100%;box-sizing:border-box">${esc(txt)}</textarea><div style="display:flex;gap:8px;margin-top:10px"><button id="vms">Save</button><button class="ghost" id="vmr">Pehle jaisa karein</button></div><label>WhatsApp number (pehle page par)</label><input id="vwn" dir="ltr" inputmode="tel" value="${esc(R.vwa||'00971555914526')}"><div style="margin-top:10px"><button id="vws">Number save karein</button></div></div><div class="card"><button id="vtest">👁 Visitor ki tarah dekhein (test)</button><div class="mut" style="margin-top:6px">Dekh sakte hain visitor ko kya nazar aayega. Kuch save nahi hota.</div></div>`}

function visFlow(o){
 const ol=g('vp');if(ol)ol.remove();
 const wa=String(o.wa||'00971555914526').replace(/[^\d+]/g,''),wan=wa.replace(/^\+/,'').replace(/^00/,'');
 const root=document.createElement('div');root.id='vp';document.body.appendChild(root);
 let pg=1,nm='';
 const lg=()=>VT[lang]||VT.en;
 const logo=px=>`<div class="vlogo" style="width:${px}px;height:${px}px"><img alt="CDM AI Studio" src="${VLOGO}"></div>`;
 const bk=t=>t.replace(/(Hisab Kitab|حساب کتاب|حساب كتاب|हिसाब किताब|হিসাব কিতাব)/g,'<b class="vbk">$1</b>');
 const chips=()=>`<div class="vchips">${Object.keys(VLN).map(k=>`<button class="vchip${k==lang?' on':''}" data-l="${k}">${VLN[k]}</button>`).join('')}</div>`;
 function bind(){root.querySelectorAll('.vchip').forEach(b=>b.onclick=()=>{const i=g('vn');if(i)nm=i.value;lang=b.dataset.l;ls('hk2lang',lang);if(g('lang'))g('lang').value=lang;applyDir();show()})}
 function show(){root.className='vp-'+lang+(pg==2?' fx':'');root.scrollTop=0;pg==1?p1():p2();bind()}
 function p1(){const T=lg(),tt=T.t.replace('{b}','<span class="vbn">Hisab Kitab</span>');
  root.innerHTML=VRB+`<div class="vpg">${chips()}${logo(210)}<div class="vcard"><div class="vtt"><span class="vhs">🏠</span><div class="vw">${tt}</div></div><div class="vsub">${T.nm}</div><input id="vn" maxlength="30" placeholder="${esc(T.ph)}" value="${esc(nm)}" autocomplete="off"><div class="vne" id="vne"></div><button class="vgold" id="vgo">${T.st}</button></div><a class="vwa" href="https://wa.me/${wan}" target="_blank" rel="noopener">${WASVG}<span>${esc(wa)}</span></a><div class="vft">${T.dv} <b>CDM AI Studio</b></div></div>`;
  const go=async()=>{const n=g('vn').value.trim();if(!n){g('vne').textContent=T.ne;return}nm=n;g('vgo').disabled=true;let ok=true;if(!o.test)ok=await o.claim(n);g('vgo').disabled=false;if(ok){pg=2;show()}};
  g('vgo').onclick=go;g('vn').onkeydown=e=>{if(e.key=='Enter')go()}}
 function p2(){const T=lg(),m=(o.vm&&o.vm[lang])||DM[lang]||DM.en,P=vmParts(m),n=m.length,z=n<300?['20px',150]:n<700?['17px',124]:n<1200?['15px',100]:['14px',80];
  root.innerHTML=VRB+`<div class="vpg v2"><div class="vhead">${logo(z[1])}<div class="vrv">${esc(T.rv)}</div></div><div class="vcard vmc" style="font-size:${z[0]}"><div class="vq">“</div>${P.h?`<div class="vh">${bk(esc(P.h))}</div>`:''}${P.p.map((x,i)=>`<div class="vrow"><div class="vt">${VIC[i%4]}</div><div class="vdv"></div><p>${bk(esc(x))}</p></div>`).join('')}${P.sig?`<div class="vsig">${esc(P.sig)}</div>`:''}</div><button class="vgold" id="vct">${T.ct}</button></div>`;
  const fit=()=>{const c=root.querySelector('.vmc');if(!c)return;let f=parseFloat(c.style.fontSize)||17;c.style.fontSize=z[0];f=parseFloat(z[0]);while(c.scrollHeight>c.clientHeight+1&&f>10.5){f-=.5;c.style.fontSize=f+'px'}};fit();setTimeout(fit,400);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
  g('vct').onclick=()=>{root.remove();if(o.test){window.VNM=nm;testEnter()}else visEnter()}}
 show()}

const SBX={ov:{},rd:{},ls:[],n:0},_dd=db.doc.bind(db),_dc=db.collection.bind(db);
const sbJ=d=>JSON.parse(JSON.stringify(d));
function sbP(p){return !!(VISITOR&&cur&&typeof p=='string'&&p.indexOf('rooms/'+cur)==0&&!/\/(visitors|vseats)(\/|$)/.test(p))}
function sbNote(){Promise.resolve().then(()=>SBX.ls.slice().forEach(l=>l.emit()))}
function sbCur(p){return p in SBX.ov?(SBX.ov[p]||{}):(SBX.rd[p]||{})}
function sbMk(k,d){return{id:k.split('/').pop(),exists:true,data:()=>sbJ(d),ref:sbDoc(k)}}
function sbSnap(p,real){let d,ex;if(p in SBX.ov){d=SBX.ov[p];ex=d!==null&&d!==undefined}else{ex=!!(real&&real.exists);d=ex?real.data():undefined}if(ex&&!(p in SBX.ov))SBX.rd[p]=d;return{id:p.split('/').pop(),exists:ex,data:()=>d?(p in SBX.ov?sbJ(d):d):undefined,ref:sbDoc(p)}}
function sbDoc(p){return{id:p.split('/').pop(),path:p,
 get:async()=>sbSnap(p,await _dd(p).get()),
 onSnapshot(cb,er){let real=null;const l={emit:()=>{if(real)cb(sbSnap(p,real))}};SBX.ls.push(l);const u=_dd(p).onSnapshot(s=>{real=s;l.emit()},e=>{real={exists:false,data:()=>undefined};l.emit();if(er)er(e)});return()=>{u();SBX.ls=SBX.ls.filter(x=>x!==l)}},
 set:async(d,op)=>{SBX.ov[p]=op&&op.merge?{...sbCur(p),...sbJ(d)}:sbJ(d);sbNote()},
 update:async d=>{SBX.ov[p]={...sbCur(p),...sbJ(d)};sbNote()},
 delete:async()=>{SBX.ov[p]=null;sbNote()},
 collection:c=>sbCol(p+'/'+c)}}
function sbQ(p,q){const o=SBX.ov,seen={},docs=[];q.docs.forEach(d=>{const k=p+'/'+d.id;seen[k]=1;if(k in o){if(o[k]!==null)docs.push(sbMk(k,o[k]))}else docs.push(d)});for(const k in o){if(o[k]!==null&&!seen[k]&&k.indexOf(p+'/')==0&&k.indexOf('/',p.length+1)<0)docs.push(sbMk(k,o[k]))}return{docs,size:docs.length,empty:!docs.length,forEach:f=>docs.forEach(f)}}
function sbCol(p){return{path:p,
 doc:id=>sbDoc(p+'/'+(id||('sbx'+(++SBX.n)))),
 add:async d=>{const id='sbx'+(++SBX.n)+Date.now().toString(36);SBX.ov[p+'/'+id]=sbJ(d);sbNote();return sbDoc(p+'/'+id)},
 get:async()=>{const q=await _dc(p).get();q.docs.forEach(d=>SBX.rd[p+'/'+d.id]=d.data());return sbQ(p,q)},
 onSnapshot(cb,er){let real=null;const l={emit:()=>{if(real)cb(sbQ(p,real))}};SBX.ls.push(l);const u=_dc(p).onSnapshot(q=>{real=q;q.docs.forEach(d=>SBX.rd[p+'/'+d.id]=d.data());l.emit()},e=>{real={docs:[]};l.emit();if(er)er(e)});return()=>{u();SBX.ls=SBX.ls.filter(x=>x!==l)}}}}
db.doc=p=>sbP(p)?sbDoc(p):_dd(p);
db.collection=p=>sbP(p)?sbCol(p):_dc(p);
function sbReset(){SBX.ov={};SBX.rd={};SBX.ls=[]}

function dl(e){return e.acc&&e.acc!=e.date?e.date+' (hisab: '+e.acc+')':e.date}
function visMsg(t,btn){g('lo').style.display='none';document.querySelector('nav').style.display='none';g('app').innerHTML='<div class="card empty">'+t+(btn?'<br><br><button id="vlo">Logout karein</button>':'')+'</div>';if(btn&&g('vlo'))g('vlo').onclick=()=>fbAuth.signOut().then(()=>location.reload())}
async function visBoot(u){
 g('lo').style.display='none';
 if(!u){try{await fbAuth.signInAnonymously()}catch(e){visMsg('Visitor link abhi chalu nahi hua. Admin se poochein.')}return}
 if(!u.isAnonymous){visMsg('Aap apne account se login hain. Visitor link ke liye logout karein, ya dusre browser mein kholein.',true);return}
 if(VISITOR)return;uid=u.uid;
 let d;try{const s=await db.doc('rooms/'+VQ.room+'/visitors/'+VQ.tok).get();if(!s.exists){visMsg('Ye link band ho chuka hai.');return}d=s.data()}catch(e){const c=e&&e.code;visMsg(c=='unavailable'||c=='resource-exhausted'||c=='deadline-exceeded'||c=='failed-precondition'?'Abhi connect nahi ho paaya (net ya server). Thodi der baad dobara try karein.':'Ye link band ho chuka hai.');return}
 if(d.uid&&d.uid!=uid){visMsg('Ye link pehle kisi aur ne istemal kar liya hai.');return}window.VNM=d.name||'';
 if(d.uid){visEnter();return}
 visFlow({vm:d.vm,wa:d.vwa,claim:n=>run(async()=>{window.VNM=n;await db.doc('rooms/'+VQ.room+'/vseats/'+uid).set({tok:VQ.tok});await db.doc('rooms/'+VQ.room+'/visitors/'+VQ.tok).update({uid,name:n,at:Date.now(),seen:Date.now(),off:0})})})}
function visEnter(){VISITOR=true;document.body.classList.add('vis');enter(VQ.room);
 subs.push(db.doc('rooms/'+VQ.room+'/visitors/'+VQ.tok).onSnapshot(s=>{if(!s.exists)visRevoked()},()=>visRevoked()))}
function visRevoked(){if(!VISITOR)return;VISITOR=false;sbReset();document.body.classList.remove('vis');leave();visMsg('Aap ka access hata diya gaya hai.')}
function visShare(tok){const l=location.origin+location.pathname.replace(/index\.html$/,'')+'?v='+cur+'.'+tok,t='Hisab Kitab dekhne ke liye ye link kholein (sirf dekhne ke liye):\n'+l;(async()=>{try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);alert('Link copy ho gaya.')}}catch(e){}})()}
g('lo').onclick=()=>ask('Logout karna hai?',()=>fbAuth.signOut());
g('app').innerHTML='<div class="card empty">Loading…</div>';
fbAuth.onAuthStateChanged(u=>{if(VQ){visBoot(u);return}
 if(!u){authMode='in';uid=null;leave();if(unsubMy){unsubMy();unsubMy=null}my={ids:[],name:''};names={};myLoaded=false;authView();return}
 uid=u.uid;g('lo').style.display='';start();render()});
